services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: disputeshield
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute -d disputeshield"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://dispute:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/disputeshield
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3001:3000"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
volumes:
  postgres_data:
