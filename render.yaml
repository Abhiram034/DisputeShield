services:
  - type: web
    name: disputeshield-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: disputeshield-db
          property: connectionString
      - key: LLM_PROVIDER
        value: none

databases:
  - name: disputeshield-db
    plan: free
    databaseName: disputeshield
    user: dispute
